<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conductor</title><link rel="stylesheet" href="../assets/styles.css"></head><body>
<header>🚌 Bus Tracker Chile · Conductor</header>
<div class="container">
  <div class="card" id="loginCard"><h2>Iniciar sesión</h2><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button id="loginButton">Ingresar</button><p id="msg" class="small"></p></div>
  <div id="driverPanel" class="hidden">
    <div class="card"><h2 id="driverName">Conductor</h2><p><b>Empresa:</b> <span id="companyName">-</span></p><p><b>Bus:</b> <span id="busName">-</span></p><p><b>Patente:</b> <span id="busPlate">-</span></p><p><b>Ruta:</b> <span id="routeName">-</span></p><p><b>Estado:</b> <span id="status" class="status offline">Detenido</span></p><button id="startButton" class="success">Iniciar recorrido</button><button id="stopButton" class="secondary">Finalizar recorrido</button><button id="incidentButton" class="danger">Reportar incidencia</button><button id="logoutButton">Cerrar sesión</button></div>
    <div class="card"><p id="gpsInfo">GPS sin iniciar.</p></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="../firebase-config.js"></script><script src="driver.js?v=4.1"></script></body></html>
